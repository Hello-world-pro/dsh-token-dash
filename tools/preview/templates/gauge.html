<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>QuotaGauge 状态全量</title>
<style>
  :root { /*__SPEC_CSS__*/ }
  /*__BASE_CSS__*/
</style>
</head>
<body>
<div class="page">
  <section>
    <h2>QuotaGauge 状态全量：normal 42.5 / 边界 89.9 · 90 / critical 96 / empty</h2>
    <div class="state-row" id="states"></div>
  </section>
</div>

<script>
  window.__SPEC__ = /*__SPEC_JSON__*/
</script>
<script>
  const G = window.__SPEC__.gauge

  const ringSvg = (percent, state) => {
    const r = (G.ring - G.stroke) / 2
    const c = 2 * Math.PI * r
    const center = G.ring / 2
    const arc = state === 'critical' ? 'var(--error)' : 'var(--text)'
    const filled = state === 'empty' ? 0 : Math.max(0, Math.min(100, percent))
    return `
      <svg viewBox="0 0 ${G.ring} ${G.ring}" aria-hidden="true">
        <circle cx="${center}" cy="${center}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${G.stroke}" />
        ${state === 'empty' ? '' : `<circle cx="${center}" cy="${center}" r="${r}" fill="none"
          stroke="${arc}" stroke-width="${G.stroke}" stroke-linecap="round"
          transform="rotate(-90 ${center} ${center})"
          stroke-dasharray="${(c * filled / 100).toFixed(2)} ${c.toFixed(2)}" />`}
      </svg>`
  }

  const gauge = (label, percent, state) => {
    const empty = state === 'empty' || percent === null
    return `
      <div class="gauge">
        <div class="ring">
          ${ringSvg(percent, empty ? 'empty' : state)}
          <span class="ring-label">${label}</span>
        </div>
        <div class="pct ${empty ? 'empty' : state}">${empty ? '—' : percent.toFixed(1) + '%'}</div>
        <div class="line">${empty ? '—' : `剩余 ${Math.round(100 - percent)}%`}</div>
        <div class="line">${empty ? '—' : '3 小时后'}</div>
        <div class="line">${empty ? '—' : '22:51'}</div>
      </div>`
  }

  const cell = (node, cap) => `<div class="state-cell">${node}<span class="cap">${cap}</span></div>`

  document.getElementById('states').innerHTML = [
    ['normal 42.5', gauge('5h', 42.5, 'normal')],
    ['边界 89.9（仍 normal）', gauge('5h', 89.9, 'normal')],
    ['边界 90（critical）', gauge('5h', 90, 'critical')],
    ['critical 96', gauge('5h', 96, 'critical')],
    ['empty（percent = null）', gauge('月', null, 'empty')],
  ].map(([cap, node]) => cell(node, cap)).join('')
</script>
</body>
</html>
