# tag push（v*）自动发布：npm pack 打 tarball → 创建 GitHub Release 并附产物。
# 产物同时是离线安装源：dsh plugin add <下载的 tgz 路径>。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pack tarball
        run: npm run pack

      - name: Create release with tarball
        uses: softprops/gh-action-release@v2
        with:
          files: build/*.tgz
          generate_release_notes: true
