# tag push（v*）自动发布：npm pack 打 tarball → 创建 GitHub Release 并附产物。
# 产物同时是离线安装源：dsh plugin add <下载的 tgz 路径>。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-local.* ]]; then
            echo "::error::本地构建版本 ${VERSION} 不能创建 GitHub Release"
            exit 1
          fi
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Pack tarball
        run: npm run pack

      - name: Generate release notes from CHANGELOG
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/release-notes.mjs "$VERSION" --out build/release-notes.md

      - name: Create release with tarball
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }} # dispatch 模式无 tag 上下文，显式指定
          files: build/*.tgz
          body_path: build/release-notes.md
