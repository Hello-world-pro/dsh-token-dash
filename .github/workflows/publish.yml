# 推送版本 tag 触发 npm 发布：校验 tag 与 package.json 版本一致，provenance 附源信息。
# 认证走 Trusted Publishing（OIDC）：npm 包设置里已信任本 workflow（publish + stage + dist-tag），
# 无需任何 NPM_TOKEN secret（granular token 直发权限 2027-01 废弃，此模式为官方推荐）。
# 注意：首次发布验证过配置后，之后推 tag 即全自动上线（无人工审批关口）。
name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance / OIDC 必需

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 校验 tag 与 package.json 版本一致
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 ${PKG_VERSION} 不一致，请修正后重打 tag"
              exit 1
            fi
          fi
          if [[ "$PKG_VERSION" == *-local.* ]]; then
            echo "::error::本地构建版本 ${PKG_VERSION} 不能发布到 npm"
            exit 1
          fi
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: 升级 npm CLI（Trusted Publishing 需要 11.5.1+，setup-node 自带版本偏旧）
        run: |
          npm install -g npm@latest
          npm --version

      # npm publish 会先执行 prepublishOnly：npm test（L1 单测，node 内置 runner 零依赖）。
      # OIDC 直发模式：不设置 NODE_AUTH_TOKEN，npm CLI 检测到 CI 的 OIDC 环境后自动换取短期令牌。
      - name: 发布到 npm
        run: |
          ARGS=(--provenance --access public)
          if [[ "$PKG_VERSION" == *-* ]]; then
            ARGS+=(--tag next)
          fi
          npm publish "${ARGS[@]}"
