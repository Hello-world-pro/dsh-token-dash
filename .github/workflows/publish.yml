# 推送版本 tag 触发 npm staged publishing：校验 tag 与 package.json 版本一致，
# 用 stage-only token 把包送入暂存区（npmjs.com → Packages → Staged Packages），
# 维护者在网页上 2FA 审批后正式发布（granular token 直发权限 2027-01 废弃，官方推荐 stage 流程）。
name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance 需要 OIDC

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 校验 tag 与 package.json 版本一致
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 ${PKG_VERSION} 不一致，请修正后重打 tag"
              exit 1
            fi
          fi
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      # npm stage publish 需要 npm CLI ≥ 11.21；把包送入暂存区，维护者在 npmjs.com 2FA 审批后正式发布。
      - name: Stage package for release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ARGS=(--access public)
          if [[ "$PKG_VERSION" == *-* ]]; then
            ARGS+=(--tag next)
          fi
          npm stage publish "${ARGS[@]}"
