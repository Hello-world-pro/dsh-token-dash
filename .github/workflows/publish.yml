# 推送版本 tag 触发 npm staged publishing：校验 tag 与 package.json 版本一致，
# 用 stage-only token 把包送入暂存区（npmjs.com → Packages → Staged Packages），
# 维护者在网页上 2FA 审批后正式发布（granular token 直发权限 2027-01 废弃，官方推荐 stage 流程）。
name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance 需要 OIDC

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Node 24 自带 npm ≥ 11.15（npm stage publish 的最低要求）
          registry-url: https://registry.npmjs.org

      - name: 校验 tag 与 package.json 版本一致
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 ${PKG_VERSION} 不一致，请修正后重打 tag"
              exit 1
            fi
          fi
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      # 裸命令（官方文档未确认 --access/--tag 参数支持；unscoped 包默认 public）。
      # 新包首次 stage 会发布 0.0.0-stage 占位版本（官方流程的一部分）。
      - name: Stage package for release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish
