# 推送版本 tag 触发 npm 发布：校验 tag 与 package.json 版本一致，provenance 附源信息。
# 认证：Granular Access Token（仓库 secret NPM_TOKEN，仅 publish 权限）；
# 后续可切换 Trusted Publishing（OIDC，npm 包设置里预信任本 workflow 后删除 token）。
name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance 需要 OIDC

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 校验 tag 与 package.json 版本一致
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 ${PKG_VERSION} 不一致，请修正后重打 tag"
              exit 1
            fi
          fi
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      # npm publish 会先执行 prepublishOnly：npm test（L1 单测，node 内置 runner 零依赖）。
      - name: 发布到 npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ARGS=(--provenance --access public)
          if [[ "$PKG_VERSION" == *-* ]]; then
            ARGS+=(--tag next)
          fi
          npm publish "${ARGS[@]}"
